[general]
host               = 192.168.0.100
port               = 2707
dash_send_delay_ms = 500
 ; DO NOT CHANGE
sample_rate        = 300
 ; DO NOT CHANGE
reads_per_sec      = 300
reset_valves_min   = 30
password           = quonk

[driver_mapping]
;ox fill
0 = EIO0
;ox_ground_vent 
1 = EIO1
;broken
2 = EIO2
;fuel_ground_vent
3 = EIO3
;fuel_remote_purge
4 = EIO4
;bps
5 = EIO5
;reserved for ignition
6 = CIO2
;ox_remote_purge
7 = CIO1
;fuel_fill
8 = CIO0

; mapping order is also column order in .csv output
[sensor_channel_mapping]
b_load_1 = AIN48
s_load_1 = AIN49
k_load_3 = AIN50
k_load_4 = AIN51
strain_1 = AIN52
strain_2 = AIN53
thermo_2 = AIN65
thermo_4 = AIN67
;combustion chamber
pres_1   = AIN68
;ox_feedline
pres_2   = AIN69
;fuel_injector
pres_3   = AIN70
;ox injector
pres_4   = AIN71
;bps pt
pres_5   = AIN64
;flowmeter (too lazy to add it as a separate sensor -.-)
pres_6   = AIN66

[sensor_negative_channels]
k_load_3 = AIN58
k_load_4 = AIN59
strain_1 = AIN60
strain_2 = AIN61

[conversion]
thermo_offset   = 1.25
thermo_scale    = .005
;big_lc_offset   = 1.2483
;big_lc_scale    = -.0002
big_lc_offset = 1.2473
big_lc_scale = -.0033
small_lc_offset = 1.2473
small_lc_scale  = -.0033
k_lc_offset = 0
k_lc_scale  = 1
;combustion chamber
pres_1_offset   = 0.4714
pres_1_scale    = 0.0018
;ox_feedline
pres_2_offset   = 0.4791
pres_2_scale    = 0.0019
;fuel_injector
pres_3_offset   = 0.4951
pres_3_scale    = 0.002
;ox injector
pres_4_offset   = 0.4862
pres_4_scale    = 0.0019
;bps
pres_5_offset   = 0.4862
pres_5_scale    = 0.0019

;flowmeter
pres_6_offset   = 1
pres_6_scale    = 1
strain_offset   = 1
strain_scale    = 1


